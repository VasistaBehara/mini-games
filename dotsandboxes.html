<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Play Dots and Boxes - The classic strategy game for 2-4 players">
    <title>Dots & Boxes | Mini Games Arcade</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⬛</text></svg>">
</head>

<body>
    <div class="page-wrapper">
        <!-- Navigation Header -->
        <header class="nav-header">
            <div class="container">
                <div class="nav-content">
                    <a href="/" class="nav-logo">
                        <span class="nav-logo-icon">🎮</span>
                        <span class="title-gradient">Mini Games</span>
                    </a>
                    <a href="/" class="back-btn">
                        <span>←</span>
                        <span>Back to Games</span>
                    </a>
                </div>
            </div>
        </header>

        <main class="game-container">
            <div class="game-header">
                <h1 class="game-title">
                    <span class="title-gradient">Dots & Boxes</span>
                </h1>
                <p class="game-subtitle">Connect dots, close boxes, win!</p>
            </div>

            <!-- Setup Screen -->
            <div class="dab-setup glass-card" id="setup-screen">
                <h2 class="setup-title">Game Setup</h2>

                <!-- Board Size -->
                <div class="setup-group">
                    <label class="setup-label">Board Size</label>
                    <div class="setup-options">
                        <button class="setup-option active" data-size="3">3×3</button>
                        <button class="setup-option" data-size="4">4×4</button>
                        <button class="setup-option" data-size="5">5×5</button>
                        <button class="setup-option" data-size="6">6×6</button>
                    </div>
                </div>

                <!-- Players Configuration -->
                <div class="setup-group">
                    <label class="setup-label">Players</label>
                    <div class="player-config">
                        <div class="player-row">
                            <span class="player-dot p1"></span>
                            <span class="player-name">Player 1</span>
                            <span class="player-type-label">You</span>
                        </div>
                        <div class="player-row">
                            <span class="player-dot p2"></span>
                            <span class="player-name">Player 2</span>
                            <select class="player-type-select" id="p2-type">
                                <option value="ai" selected>Computer</option>
                                <option value="human">Human</option>
                            </select>
                        </div>
                        <div class="player-row">
                            <span class="player-dot p3"></span>
                            <span class="player-name">Player 3</span>
                            <select class="player-type-select" id="p3-type">
                                <option value="none" selected>None</option>
                                <option value="ai">Computer</option>
                                <option value="human">Human</option>
                            </select>
                        </div>
                        <div class="player-row">
                            <span class="player-dot p4"></span>
                            <span class="player-name">Player 4</span>
                            <select class="player-type-select" id="p4-type">
                                <option value="none" selected>None</option>
                                <option value="ai">Computer</option>
                                <option value="human">Human</option>
                            </select>
                        </div>
                    </div>
                </div>

                <button class="btn btn-primary" id="start-btn">▶ Start Game</button>
            </div>

            <!-- Game Screen (Hidden initially) -->
            <div class="dab-game hidden" id="game-screen">
                <!-- Scoreboard -->
                <div class="dab-scoreboard glass-card" id="scoreboard">
                    <!-- Generated by JS -->
                </div>

                <!-- Turn Indicator -->
                <div class="turn-indicator" id="turn-indicator">
                    Player 1's Turn
                </div>

                <!-- Game Board -->
                <div class="dab-board" id="board">
                    <!-- Generated by JS -->
                </div>

                <!-- Controls -->
                <div class="game-controls">
                    <button class="btn btn-secondary" id="restart-btn">🔄 Restart</button>
                    <button class="btn btn-secondary" id="menu-btn">⚙️ New Game</button>
                </div>
            </div>
        </main>

        <!-- Winner Overlay -->
        <div class="winner-overlay" id="winner-overlay">
            <div class="winner-content">
                <div class="winner-icon" id="winner-icon">🏆</div>
                <h2 class="winner-title win" id="winner-title">Player 1 Wins!</h2>
                <p class="winner-message" id="winner-message">Final Score: 5 boxes</p>
                <div class="winner-buttons">
                    <button class="btn btn-primary" id="play-again-btn">🔄 Play Again</button>
                    <button class="btn btn-secondary" id="new-game-btn">⚙️ New Game</button>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <footer class="footer">
            <div class="container">
                <p>Mini Games Arcade &copy; 2026</p>
            </div>
        </footer>
    </div>

    <script src="js/dotsandboxes.js"></script>
</body>

</html>
