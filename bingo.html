<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Play Bingo against an AI opponent - race to complete your card first!">
    <title>Bingo | Mini Games Arcade</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">
</head>

<body>
    <div class="page-wrapper">
        <!-- Navigation Header -->
        <header class="nav-header">
            <div class="container">
                <div class="nav-content">
                    <a href="/" class="nav-logo">
                        <span class="nav-logo-icon">🎮</span>
                        <span class="title-gradient">Mini Games</span>
                    </a>
                    <a href="/" class="back-btn">
                        <span>←</span>
                        <span>Back to Games</span>
                    </a>
                </div>
            </div>
        </header>

        <!-- Game Container -->
        <main class="game-container">
            <!-- Game Header -->
            <div class="game-header">
                <h1 class="game-title">
                    <span class="title-gradient">Bingo</span>
                </h1>
                <p class="game-subtitle">Race the AI to complete a line first!</p>
            </div>

            <!-- Score Board -->
            <div class="scoreboard glass-card">
                <div class="score-item player">
                    <div class="score-label">Your Wins</div>
                    <div class="score-value" id="player-score">0</div>
                </div>
                <div class="score-item ai">
                    <div class="score-label">AI Wins</div>
                    <div class="score-value" id="ai-score">0</div>
                </div>
            </div>

            <!-- Bingo Game Area -->
            <div class="bingo-game-area">
                <!-- Player's Card -->
                <div class="bingo-player-section">
                    <div class="bingo-player-label player">Your Card</div>
                    <div class="bingo-card glass-card">
                        <div class="bingo-header">
                            <div class="bingo-header-cell">B</div>
                            <div class="bingo-header-cell">I</div>
                            <div class="bingo-header-cell">N</div>
                            <div class="bingo-header-cell">G</div>
                            <div class="bingo-header-cell">O</div>
                        </div>
                        <div class="bingo-grid" id="player-card">
                            <!-- Generated by JavaScript -->
                        </div>
                    </div>
                </div>

                <!-- Number Caller -->
                <div class="caller-section glass-card">
                    <div class="caller-title">Current Number</div>
                    <div class="current-call" id="current-call">
                        <span class="letter"></span>
                        <span class="number">--</span>
                    </div>
                    <button class="btn btn-primary call-btn" id="call-btn">
                        📢 Call Number
                    </button>
                    <!-- <div class="called-numbers"> Removed from here -->
                </div>

                <!-- AI's Card -->
                <div class="bingo-player-section">
                    <div class="bingo-player-label ai">AI's Card</div>
                    <div class="bingo-card glass-card">
                        <div class="bingo-header">
                            <div class="bingo-header-cell">B</div>
                            <div class="bingo-header-cell">I</div>
                            <div class="bingo-header-cell">N</div>
                            <div class="bingo-header-cell">G</div>
                            <div class="bingo-header-cell">O</div>
                        </div>
                        <div class="bingo-grid" id="ai-card">
                            <!-- Generated by JavaScript -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- Called Numbers History (New Location) -->
            <div class="called-numbers-section glass-card">
                <div class="called-numbers-title">Called Numbers History</div>
                <div class="called-list" id="called-list">
                    <!-- Numbers will appear here -->
                </div>
            </div>

            <!-- Game Controls -->
            <div class="game-controls">
                <button class="btn btn-primary" id="new-game-btn">
                    🔄 New Game
                </button>
                <button class="btn btn-secondary" id="reset-scores-btn">
                    🗑️ Reset Scores
                </button>
            </div>
        </main>

        <!-- Winner Overlay -->
        <div class="winner-overlay" id="winner-overlay">
            <div class="winner-content">
                <div class="winner-icon" id="winner-icon">🎉</div>
                <h2 class="winner-title" id="winner-title">BINGO!</h2>
                <p class="winner-message" id="winner-message">You got Bingo first!</p>
                <div class="winner-buttons">
                    <button class="btn btn-primary" id="play-again-btn">
                        🔄 Play Again
                    </button>
                    <a href="/" class="btn btn-secondary">
                        🏠 Back to Home
                    </a>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <footer class="footer">
            <div class="container">
                <p>Mini Games Arcade &copy; 2026</p>
            </div>
        </footer>
    </div>

    <script src="js/bingo.js"></script>
</body>

</html>
